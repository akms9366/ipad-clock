<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>iPad Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+JP:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --accent: #00d4ff;
      --accent2: #0099cc;
      --accent-dim: rgba(0,212,255,0.15);
      --accent-glow: rgba(0,212,255,0.4);
      --text: #e8f4f8;
      --text-dim: rgba(232,244,248,0.45);
      --danger: #ff4466;
      --danger-dim: rgba(255,68,102,0.15);
      --danger-glow: rgba(255,68,102,0.5);
      --warn: #ffaa00;
      --warn-glow: rgba(255,170,0,0.5);
      --panel: rgba(255,255,255,0.05);
      --panel-border: rgba(0,212,255,0.18);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 32px 40px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* ══ CLOCK ══ */
    .clock-section {
      text-align: center;
      width: 100%;
    }

    .time-display {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(64px, 13vw, 148px);
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--accent);
      text-shadow:
        0 0 24px var(--accent-glow),
        0 0 70px var(--accent-glow),
        0 0 130px rgba(0,212,255,0.18);
      white-space: nowrap;
      user-select: none;
    }

    .date-display {
      font-size: clamp(16px, 3vw, 26px);
      font-weight: 300;
      color: var(--text-dim);
      letter-spacing: 0.14em;
      margin-top: 14px;
      user-select: none;
    }

    .weather-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      min-height: 28px;
    }

    .weather-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: clamp(13px, 1.8vw, 17px);
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .weather-icon { font-size: 1.2em; line-height: 1; }
    .weather-temp { font-family: 'Orbitron', monospace; font-size: 0.95em; color: var(--text); }

    /* ══ DIVIDER ══ */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--panel-border), transparent);
      margin: 24px 0 20px;
    }

    /* ══ COUNTDOWN (compact) ══ */
    .countdown-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .cd-control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .cd-label {
      font-size: clamp(11px, 1.5vw, 14px);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-dim);
      white-space: nowrap;
    }

    .cd-input {
      background: var(--panel);
      border: 1.5px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Orbitron', monospace;
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 700;
      padding: 8px 14px;
      text-align: center;
      outline: none;
      width: clamp(110px, 18vw, 170px);
      letter-spacing: 0.06em;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cd-input::-webkit-calendar-picker-indicator { display: none; }

    .cd-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-dim);
    }

    .cd-btn {
      border: none;
      border-radius: 8px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: clamp(12px, 1.6vw, 16px);
      font-weight: 400;
      padding: 8px 18px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .cd-btn-start { background: var(--accent); color: #000; }
    .cd-btn-start:active { background: #33ddff; }

    .cd-btn-clear {
      background: var(--panel);
      border: 1.5px solid var(--panel-border);
      color: var(--text-dim);
    }
    .cd-btn-clear:active { border-color: var(--danger); color: var(--danger); }

    .cd-result {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      width: 100%;
    }
    .cd-result.active { display: flex; }

    .cd-target-label {
      font-size: clamp(10px, 1.4vw, 13px);
      color: var(--text-dim);
      letter-spacing: 0.14em;
    }

    .cd-time {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(28px, 6vw, 56px);
      letter-spacing: 0.06em;
      line-height: 1;
      color: var(--accent);
      text-shadow: 0 0 16px var(--accent-glow), 0 0 40px var(--accent-glow);
      user-select: none;
      transition: color 0.3s, text-shadow 0.3s;
    }

    .cd-time.warn {
      color: var(--warn);
      text-shadow: 0 0 16px var(--warn-glow), 0 0 40px var(--warn-glow);
    }

    .cd-time.urgent {
      color: var(--danger);
      text-shadow: 0 0 16px var(--danger-glow), 0 0 40px var(--danger-glow);
      animation: pulse 0.8s ease-in-out infinite;
    }

    .cd-time.ended {
      color: var(--danger);
      text-shadow: 0 0 16px var(--danger-glow), 0 0 40px var(--danger-glow);
      font-size: clamp(20px, 4vw, 40px);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    .cd-progress-wrap {
      width: 100%;
      max-width: 500px;
      height: 4px;
      background: var(--panel);
      border-radius: 99px;
      overflow: hidden;
    }

    .cd-progress {
      height: 100%;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border-radius: 99px;
      transition: width 1s linear, background 0.3s;
    }

    .cd-progress.warn { background: linear-gradient(90deg, #cc8800, var(--warn)); }
    .cd-progress.urgent { background: linear-gradient(90deg, #cc0033, var(--danger)); }

    @media (orientation: landscape) and (max-height: 600px) {
      .container { padding: 16px 32px; }
      .time-display { font-size: clamp(44px, 10vh, 100px); }
      .divider { margin: 14px 0 12px; }
    }

    @media (min-width: 768px) and (min-height: 1024px) {
      .time-display { font-size: clamp(100px, 14vw, 164px); }
      .container { padding: 48px 48px 36px; }
    }
  </style>
</head>
<body>
<div class="container">

  <div class="clock-section">
    <div class="time-display" id="timeDisplay">00:00:00</div>
    <div class="date-display" id="dateDisplay">----年--月--日（-）</div>
    <div class="weather-display" id="weatherDisplay"></div>
  </div>

  <div class="divider"></div>

  <div class="countdown-section">
    <div class="cd-control-row">
      <span class="cd-label">カウントダウン</span>
      <input type="time" class="cd-input" id="targetTimeInput">
      <button class="cd-btn cd-btn-start" id="startBtn" onclick="startCountdown()">スタート</button>
      <button class="cd-btn cd-btn-clear" id="clearBtn" onclick="clearCountdown()" style="display:none">クリア</button>
    </div>
    <div class="cd-result" id="cdResult">
      <div class="cd-target-label" id="targetLabel"></div>
      <div class="cd-time" id="countdownTime"></div>
      <div class="cd-progress-wrap">
        <div class="cd-progress" id="progressBar" style="width:100%"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const DAY_NAMES = ['日','月','火','水','木','金','土'];

  let countdownTarget = null, countdownStartMs = null, countdownTotalMs = null;

  function pad(n) { return String(n).padStart(2,'0'); }

  function formatRemaining(ms) {
    if (ms <= 0) return '時間終了';
    const s = Math.ceil(ms / 1000);
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
    return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sc)}` : `${pad(m)}:${pad(sc)}`;
  }

  function tick() {
    const now = new Date();
    document.getElementById('timeDisplay').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    document.getElementById('dateDisplay').textContent =
      `${now.getFullYear()}年${pad(now.getMonth()+1)}月${pad(now.getDate())}日（${DAY_NAMES[now.getDay()]}）`;

    if (countdownTarget !== null) {
      const remaining = countdownTarget - now.getTime();
      const el = document.getElementById('countdownTime');
      const bar = document.getElementById('progressBar');
      if (remaining <= 0) {
        el.textContent = '時間終了！';
        el.className = 'cd-time ended';
        bar.style.width = '0%';
        bar.className = 'cd-progress urgent';
      } else {
        el.textContent = formatRemaining(remaining);
        const pct = countdownTotalMs > 0 ? Math.min(100,(remaining/countdownTotalMs)*100) : 100;
        bar.style.width = `${pct}%`;
        if (remaining <= 60000) {
          el.className = 'cd-time urgent';
          bar.className = 'cd-progress urgent';
        } else if (remaining <= 300000) {
          el.className = 'cd-time warn';
          bar.className = 'cd-progress warn';
        } else {
          el.className = 'cd-time';
          bar.className = 'cd-progress';
        }
      }
    }
  }

  function startCountdown() {
    const val = document.getElementById('targetTimeInput').value;
    if (!val) return;
    const [th, tm] = val.split(':').map(Number);
    const now = new Date();
    const target = new Date(now);
    target.setHours(th, tm, 0, 0);
    if (target <= now) target.setDate(target.getDate() + 1);
    countdownTarget = target.getTime();
    countdownStartMs = now.getTime();
    countdownTotalMs = countdownTarget - countdownStartMs;
    document.getElementById('targetLabel').textContent = `目標: ${pad(th)}:${pad(tm)}`;
    document.getElementById('cdResult').classList.add('active');
    document.getElementById('clearBtn').style.display = '';
    document.getElementById('startBtn').textContent = '変更';
    tick();
  }

  function clearCountdown() {
    countdownTarget = countdownStartMs = countdownTotalMs = null;
    document.getElementById('cdResult').classList.remove('active');
    document.getElementById('clearBtn').style.display = 'none';
    document.getElementById('startBtn').textContent = 'スタート';
    document.getElementById('targetTimeInput').value = '';
    document.getElementById('countdownTime').className = 'cd-time';
    document.getElementById('progressBar').className = 'cd-progress';
    document.getElementById('progressBar').style.width = '100%';
  }

  tick();
  setInterval(tick, 1000);

  const WMO = {
    0:'☀️',1:'🌤️',2:'⛅',3:'☁️',
    45:'🌫️',48:'🌫️',
    51:'🌦️',53:'🌦️',55:'🌦️',
    61:'🌧️',63:'🌧️',65:'🌧️',
    71:'🌨️',73:'🌨️',75:'🌨️',77:'🌨️',
    80:'🌦️',81:'🌦️',82:'🌦️',
    85:'🌨️',86:'🌨️',
    95:'⛈️',96:'⛈️',99:'⛈️'
  };

  async function loadWeather() {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(async ({ coords }) => {
      try {
        const { latitude: lat, longitude: lon } = coords;
        const [meteo, geo] = await Promise.all([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`).then(r => r.json()),
          fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja`).then(r => r.json())
        ]);
        const temp = Math.round(meteo.current.temperature_2m);
        const icon = WMO[meteo.current.weather_code] ?? '🌡️';
        const city = geo.address?.city || geo.address?.town || geo.address?.village || geo.address?.county || '';
        document.getElementById('weatherDisplay').innerHTML = `
          <div class="weather-chip">
            <span class="weather-icon">${icon}</span>
            ${city ? `<span>${city}</span>` : ''}
            <span class="weather-temp">${temp}°C</span>
          </div>`;
      } catch (_) {}
    }, () => {}, { timeout: 8000 });
  }

  loadWeather();

  (async () => {
    try {
      if ('wakeLock' in navigator) {
        let lock = await navigator.wakeLock.request('screen');
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') lock = await navigator.wakeLock.request('screen');
        });
      }
    } catch (_) {}
  })();
</script>
</body>
</html>
